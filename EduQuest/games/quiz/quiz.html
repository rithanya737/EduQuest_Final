<head>
    <meta charset="UTF-8">

<a class="wtd-home-link" href="../../home/index.html">🏠 Home</a>

    <div class="quiz-container">

        <h2 id="quiz-title"></h2>

        <p id="question-number">Question 1 of 10</p>

        <div class="question-box">
            <h3 id="question"></h3>

            <button class="option" id="option4"></button>

        </div>

        <button id="next-button">Next</button>

        <h3 id="score"></h3>

        <button id="wheel-button">Back to Spin Wheel</button>

    </div>

    <script src="js/quiz.js"></script>
