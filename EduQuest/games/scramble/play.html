<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Word Scramble &mdash; Play</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="../../assets/css/site-theme.css">
</head>

<body>
<a class="wtd-home-link" href="../../home/index.html">🏠 Home</a>

    

    <div class="game-container">

        <h1>🇮🇳 India Word Scramble</h1>

        <h2 id="topic-title">
            Indian Science & Technology
        </h2>

        <p id="word-number">
            Word 1 of 5
        </p>

        

        <div id="hearts">

            ❤️ ❤️ ❤️

        </div>

        

        <div class="scrambled-box">

            <h2 id="scrambled-word">
            </h2>

            <p>
                Unscramble the word!
            </p>

        </div>

        

        <div class="hints">

            <button id="hint1">
                💡 Hint 1
            </button>

            <button id="hint2">
                💡 Hint 2
            </button>

        </div>

        

        <p id="hint-text"></p>

        

        <input
            type="text"
            id="answer"
            placeholder="Enter your answer"
        >

        <br>

        <button id="submit-button">
            Submit
        </button>

        <button id="next-button">
            Next
        </button>

    </div>

    

    <div id="result-page">

        <h1>
            🎉 Game Completed!
        </h1>

        <h2 id="final-topic">
        </h2>

        <p id="final-score">
        </p>

        <p>
            Great job! Keep learning about India.
        </p>

        <button id="play-again">
            Play Again
        </button>

        <button id="back-to-topics">
            Back to Topics
        </button>

    </div>

    <script src="js/scramble.js"></script>

<script src="../../home/js/eduquest-data.js"></script>
</body>

</html>
