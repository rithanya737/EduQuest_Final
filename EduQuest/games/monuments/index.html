<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monuments of India - Memory Game</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Inter", "Segoe UI", Verdana, Arial, sans-serif;
            background: linear-gradient(180deg, #fff4e6 0%, #faf6ef 45%, #eafbea 100%);
            text-align: center;
        }

        h1 {
            margin-top: 34px;
            margin-bottom: 4px;
            font-family: "Fraunces", Georgia, serif;
            font-weight: 600;
            color: #16284d;
            font-size: 2.1rem;
        }

        .subtitle {
            color: #55483f;
            margin-bottom: 20px;
        }

        

        .levels {
            margin: 20px;
        }

        .level-btn {
            padding: 11px 26px;
            margin: 5px;
            border: none;
            border-radius: 999px;
            color: white;
            font-family: "Inter", inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
        }

        .easy {
            background: #14693f;
        }

        .easy:hover {
            background: #0d4c2d;
        }

        .medium {
            background: #b8630f;
        }

        .medium:hover {
            background: #94500c;
        }

        .hard {
            background: #9c2b2b;
        }

        .hard:hover {
            background: #7a2020;
        }

        .level-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.25);
        }

        .score {
            font-size: 21px;
            font-weight: 700;
            color: #16284d;
            margin: 18px;
        }

        

        #game {
            width: 850px;
            max-width: 95%;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .card {
            height: 180px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;

            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .front,
        .back {
            width: 100%;
            height: 100%;

            position: absolute;
            backface-visibility: hidden;

            border-radius: 12px;
            overflow: hidden;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        

        .back {
            background: #16284d;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 42px;
            color: white;
        }

        .front {
            background: white;
            transform: rotateY(180deg);
        }

        .front img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        .front p {
            margin: 10px 8px;
            font-family: "Fraunces", Georgia, serif;
            font-weight: 600;
            color: #1c1b19;
        }

        .restart {
            margin: 28px;
            padding: 13px 30px;

            border: none;
            border-radius: 999px;

            background: #16284d;
            color: white;
            font-family: "Inter", inherit;
            font-size: 15.5px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.18s ease, background 0.18s ease;
        }

        .restart:hover {
            background: #0b1830;
            transform: translateY(-2px);
        }

        

        @media (max-width: 600px) {

            #game {
                grid-template-columns: repeat(2, 1fr);
            }

            .card {
                height: 170px;
            }

        }

    </style>

<link rel="stylesheet" href="../../assets/css/site-theme.css">
</head>

<body>
<a class="wtd-home-link" href="../../home/index.html">🏠 Home</a>

    <h1>Monuments of India</h1>

    <p class="subtitle">
        Find the matching monuments!
    </p>

    

    <div class="levels">

        <button class="level-btn easy" onclick="startGame('easy')">
            Easy
        </button>

        <button class="level-btn medium" onclick="startGame('medium')">
            Medium
        </button>

        <button class="level-btn hard" onclick="startGame('hard')">
            Hard
        </button>

    </div>

    

    <h3>
        Level: <span id="level">Easy</span>
    </h3>

    

    <div class="score">

        Score:
        <span id="score">0</span>

    </div>

    

    <div id="game"></div>

    

    <button class="restart" onclick="restartGame()">
        Restart Game
    </button>

    <script>
const monuments = [ {
    name: "Taj Mahal",
    image: "images/tajmahal.jpg"
}, {
    name: "India Gate",
    image: "images/indiagate.jpg"
}, {
    name: "Qutub Minar",
    image: "images/qutubminar.jpg"
}, {
    name: "Red Fort",
    image: "images/redfort.jpg"
}, {
    name: "Gateway of India",
    image: "images/gatewayofindia.jpg"
}, {
    name: "Charminar",
    image: "images/charminar.jpg"
}, {
    name: "Hawa Mahal",
    image: "images/hawamahal.jpg"
}, {
    name: "Mysore Palace",
    image: "images/mysorepalace.jpg"
} ];

const levels = {
    easy: 4,
    medium: 6,
    hard: 8
};

let cards = [];

let firstCard = null;

let secondCard = null;

let score = 0;

let lockBoard = false;

let matchedPairs = 0;

let currentLevel = "easy";
let scoreSaved = false;

function startGame(level) {
    currentLevel = level;
    const game = document.getElementById("game");
    game.innerHTML = "";
    score = 0;
    scoreSaved = false;
    matchedPairs = 0;
    firstCard = null;
    secondCard = null;
    lockBoard = false;
    document.getElementById("score").textContent = score;
    document.getElementById("level").textContent = level.charAt(0).toUpperCase() + level.slice(1);
    const numberOfMonuments = levels[level];
    const selectedMonuments = monuments.slice(0, numberOfMonuments);
    cards = [ ...selectedMonuments, ...selectedMonuments ];
    cards.sort(() => Math.random() - .5);
    cards.forEach(monument => {
        const card = document.createElement("div");
        card.classList.add("card");
        card.dataset.name = monument.name;
        card.innerHTML = `\n\n                    <div class="card-inner">\n\n                        <div class="back">\n                            🇮🇳\n                        </div>\n\n                        <div class="front">\n\n                            <img\n                                src="${monument.image}"\n                                alt="${monument.name}"\n                            >\n\n                            <p>\n                                ${monument.name}\n                            </p>\n\n                        </div>\n\n                    </div>\n\n                `;
        card.addEventListener("click", flipCard);
        game.appendChild(card);
    });
}

function flipCard() {
    if (lockBoard) return;
    if (this === firstCard) return;
    if (this.classList.contains("matched")) return;
    this.classList.add("flipped");
    if (firstCard === null) {
        firstCard = this;
        return;
    }
    secondCard = this;
    checkMatch();
}

function checkMatch() {
    const match = firstCard.dataset.name === secondCard.dataset.name;
    if (match) {
        score++;
        matchedPairs++;
        document.getElementById("score").textContent = score;
        firstCard.classList.add("matched");
        secondCard.classList.add("matched");
        resetCards();
        const numberOfMonuments = levels[currentLevel];
        if (matchedPairs === numberOfMonuments) {
            if (typeof EduQuestData !== "undefined") { EduQuestData.saveScore("monuments", score); }
            setTimeout(() => {
                alert("🎉 Congratulations!\n\n" + "You completed the " + currentLevel + " level!\n\n" + "Your score: " + score);
            }, 500);
        }
    } else {
        lockBoard = true;
        setTimeout(() => {
            firstCard.classList.remove("flipped");
            secondCard.classList.remove("flipped");
            resetCards();
        }, 1e3);
    }
}

function resetCards() {
    firstCard = null;
    secondCard = null;
    lockBoard = false;
}

function restartGame() {
    startGame(currentLevel);
}

startGame("easy");</script>

<script src="../../home/js/eduquest-data.js"></script>
</body>

</html>
